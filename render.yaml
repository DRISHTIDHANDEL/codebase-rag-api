services:
  - type: web
    name: rag-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString

  - type: worker
    name: rag-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rag-redis
          property: connectionString

  - type: redis
    name: rag-redis
    plan: free

databases:
  - name: rag-db
    plan: free
